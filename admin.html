<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理画面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Helvetica", "Arial", sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #111;
    }

    tr:nth-child(even) {
      background: #1a1a1a;
    }

    button {
      padding: 6px 12px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #ff3b30;
      color: #fff;
    }

    .reload-btn {
      background: #4cd964;
      color: #000;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>予約管理画面</h1>

  <button class="reload-btn" onclick="loadReservations()">最新の状態に更新</button>

  <table id="reservation-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>日付</th>
        <th>時間</th>
        <th>名前</th>
        <th>メニュー</th>
        <th>状態</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="admin.js"></script>
</body>
</html>
