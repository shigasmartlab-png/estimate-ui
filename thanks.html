<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>予約完了</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Helvetica", "Arial", sans-serif;
      padding: 20px;
      text-align: center;
    }
    .id-box {
      background: #111;
      padding: 15px;
      margin: 10px 0;
      border-radius: 6px;
      font-size: 18px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .top-btn {
      background: #4cd964;
      color: #000;
    }
    .cancel-btn {
      background: #ff3b30;
      color: #fff;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <h1>予約が完了しました</h1>
  <p>以下が予約IDです。控えておいてください。</p>

  <div id="id-area"></div>

  <button class="top-btn" onclick="location.href='index.html'">トップに戻る</button>
  <button class="cancel-btn" onclick="location.href='cancel.html'">予約をキャンセルする</button>

  <script>
    const params = new URLSearchParams(location.search);
    const ids = params.get("ids")?.split(",") || [];

    const area = document.getElementById("id-area");

    ids.forEach((id, i) => {
      const div = document.createElement("div");
      div.className = "id-box";
      div.textContent = `${i + 1}台目：${id}`;
      area.appendChild(div);
    });
  </script>

</body>
</html>
